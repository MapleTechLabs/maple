receivers:
    file_log/app:
        include: [/var/log/app/app.json.log]
        operators:
            - type: json_parser
              timestamp:
                  parse_from: attributes.ts
                  layout_type: gotime
                  layout: "2006-01-02T15:04:05Z07:00"
              severity:
                  parse_from: attributes.level
            - type: move
              from: attributes.msg
              to: body
