name: Release

# Keeps a "Version Packages" PR open on main while changesets are pending. Merging it bumps
# the public npm packages, so the next run finds unpublished versions and publishes them
# (scripts/publish-packages.ts), then pushes the tags and cuts GitHub releases. The private CLI
# is not on npm, so a new apps/cli version is tagged `v<version>` here and the local binary
# release is dispatched on that tag.

on:
    push:
        branches: [main]
        paths:
            - ".changeset/**"
            - "packages/effect-sdk/package.json"
            - "packages/browser/package.json"
            - "packages/alchemy-maple/package.json"
            - "apps/cli/package.json"
            - "scripts/publish-packages.ts"
            - ".github/workflows/release.yml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        if: ${{ vars.MAPLE_RELEASE_ENABLED == 'true' }}
        name: Version or publish
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: npm-publish
        permissions:
            contents: write # version commit, tags, GitHub releases
            pull-requests: write # the Version Packages PR
            id-token: write # npm trusted publishing + provenance
            actions: write # dispatch the local binary release for a new CLI version
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: ./.github/actions/setup
              with:
                  turbo-cache: "false"
            - name: Configure npm token fallback
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  if [ -n "$NODE_AUTH_TOKEN" ]; then
                    echo '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
                  fi

            - id: changesets
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: bun run changeset:version
                  publish-script: bun run changeset:publish
                  commit-message: "chore(release): version packages"
                  pr-title: "chore(release): version packages"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fallback until each package has npm trusted publishing configured
                  # (a brand-new package needs its first publish before that is possible).
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: "true"

            # A tag pushed with GITHUB_TOKEN starts no workflows, so the binary release is
            # dispatched on the new tag explicitly.
            - name: Tag and release the CLI
              if: steps.changesets.outputs.has-changesets == 'false'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="v$(jq -r .version apps/cli/package.json)"
                  if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
                    echo "$tag already exists"
                    exit 0
                  fi
                  gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
                  gh workflow run local-binary-release.yml --ref "$tag"
