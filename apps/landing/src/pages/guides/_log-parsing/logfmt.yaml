receivers:
    file_log/worker:
        include: [/var/log/worker/worker.log]
        resource:
            service.name: worker
        operators:
            - type: key_value_parser
              timestamp:
                  parse_from: attributes.time
                  layout_type: gotime
                  layout: "2006-01-02T15:04:05Z07:00"
              severity:
                  parse_from: attributes.level

processors:
    batch: {}

exporters:
    otlp_http/maple:
        endpoint: https://ingest.maple.dev
        compression: gzip
        headers:
            x-maple-ingest-key: ${env:MAPLE_INGEST_KEY}

service:
    pipelines:
        logs:
            receivers: [file_log/worker]
            processors: [batch]
            exporters: [otlp_http/maple]
