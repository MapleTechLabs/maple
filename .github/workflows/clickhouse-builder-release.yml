name: ClickHouse builder release checks

# Run on the release commit before publishing. Reusable by a future publishing
# workflow via needs; this workflow validates artifacts and never publishes.
on:
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    release-checks:
        name: Builder / ClickHouse ${{ matrix.clickhouse }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                clickhouse: ["26.2.19.43", "26.8.2.7"]
        services:
            clickhouse:
                image: clickhouse/clickhouse-server:${{ matrix.clickhouse }}
                env:
                    CLICKHOUSE_USER: maple
                    CLICKHOUSE_PASSWORD: maple
                    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
                ports:
                    - 8123:8123
                options: >-
                    --health-cmd "clickhouse-client --user maple --password maple --query 'SELECT 1'"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
            - uses: ./.github/actions/bun-install
              with:
                  filters: "@maple-dev/clickhouse-builder"
            - name: Check package, types, unit tests and live dialect
              env:
                  CLICKHOUSE_BUILDER_TEST_URL: http://127.0.0.1:8123
                  CLICKHOUSE_BUILDER_TEST_USER: maple
                  CLICKHOUSE_BUILDER_TEST_PASSWORD: maple
              run: bun run --cwd lib/clickhouse-builder test:release
