name: Cleanup Preview Orphans

# Backstop for preview resources the close-event teardown misses (no `closed` run
# for a conflicting PR, PRs running an old workflow file, a deploy landing after close).
# Sweeps map `pr-<n>` names to THIS repo's PR numbers: never share these accounts with another repo.

on:
    schedule:
        # Orphaned Tinybird branches share production compute.
        - cron: "17 */6 * * *"
    workflow_dispatch:

permissions:
    contents: read
    pull-requests: read # sweep checks each pr-<n> branch's PR state
    id-token: write # Infisical OIDC machine-identity auth

concurrency:
    group: cleanup-preview-orphans
    cancel-in-progress: false

jobs:
    sweep:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # STOPGAP: borrows `pr-preview` only so the OIDC subject matches Infisical's allowlist.
        # Do not add required reviewers to `pr-preview` (cron would park). Fix: allowlist
        # `repo:<org>/<repo>:ref:refs/heads/main`, then drop this line.
        environment: pr-preview # stopgap: remove once the ref subject is allowlisted
        env:
            INFISICAL_ENV_SLUG: dev
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - name: Setup mise (toolchain)
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

            # Before secrets load, so the installer never sees them. `continue-on-error` so a
            # tinybird.co outage skips only the Tinybird sweep, not all of them.
            - name: Install Tinybird CLI
              id: install-tinybird-cli
              continue-on-error: true
              run: curl https://tinybird.co | sh

            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  export-type: "env"
                  secret-path: "/"

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Sweep orphaned Tinybird PR branches
              if: ${{ !cancelled() && env.TINYBIRD_TOKEN != '' && steps.install-tinybird-cli.outcome == 'success' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: bun scripts/tinybird-pr-branch.ts sweep

            # Workers before Hyperdrive (zombie crons on a deleted config flood logs), and
            # Queues before Workers (a registered consumer can't be deleted, error 10064).
            - name: Sweep orphaned preview Queues and Workers
              if: ${{ !cancelled() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: bun scripts/cloudflare-worker-orphan-sweep.ts

            # Residual: previews no longer create Hyperdrive configs, but leaked
            # `maple-db-pr-*` configs count against the 25-per-account cap.
            - name: Sweep orphaned Hyperdrive PR configs
              if: ${{ !cancelled() && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: bun scripts/hyperdrive-orphan-sweep.ts
