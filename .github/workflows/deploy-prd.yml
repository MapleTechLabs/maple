name: Deploy PRD (Cloudflare via Alchemy)

# Gated on CI passing (not `push: main`); `workflow_dispatch` skips the gate.
# `branches: [main]` matches the CI run's head branch name, which a pull request
# from another repository can share, so each job also requires a push from this repo.
# One commit ships to every instance via `deploy-prd-instance.yml`; the ingest
# binary is built once and shared.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-prd
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical OIDC machine-identity auth

jobs:
    # Separate job for the arm64 runner; same gate so a red CI builds nothing.
    ingest-binary:
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        uses: ./.github/workflows/build-ingest-binary.yml

    # On workflow_run, `github.sha` is the branch head, not the commit CI tested: pin head_sha.
    deploy-prd:
        needs: ingest-binary
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
        uses: ./.github/workflows/deploy-prd-instance.yml
        secrets: inherit
        with:
            region: us
            commit-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    # EU instance (`*.eu.maple.dev`), opt-in via the `MAPLE_DEPLOY_EU` repo variable.
    # Runs alongside `us`: separate stage, environment and database, so neither blocks the other.
    deploy-prd-eu:
        needs: ingest-binary
        if: ${{ vars.MAPLE_DEPLOY_EU == '1' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
        uses: ./.github/workflows/deploy-prd-instance.yml
        secrets: inherit
        with:
            region: eu
            commit-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    # Skipped jobs do not fail a run, so this always runs and fails when nothing
    # deployed. A cancelled CI run (superseded by a newer push) is not a failure.
    deployment-gate:
        needs: [deploy-prd, deploy-prd-eu]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Report whether the deploy ran
              env:
                  CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  CI_EVENT: ${{ github.event.workflow_run.event }}
                  CI_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
                  REPO: ${{ github.repository }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  result="${{ needs.deploy-prd.result }}"
                  if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && { [ "$CI_EVENT" != "push" ] || [ "$CI_REPO" != "$REPO" ]; }; then
                      echo "::notice::Nothing to deploy: CI ran for a $CI_EVENT from $CI_REPO, not a push to main."
                      exit 0
                  fi
                  if [ "$result" = "skipped" ] && [ "$CI_CONCLUSION" = "cancelled" ]; then
                      echo "::notice::Nothing to deploy: CI for $HEAD_SHA was cancelled, superseded by a newer push to main."
                      exit 0
                  fi
                  if [ "$result" = "skipped" ]; then
                      echo "::error::Nothing was deployed: CI did not pass for $HEAD_SHA. Fix main, then re-run."
                      exit 1
                  fi
                  # Real deploy failures already fail their own job. EU skips until MAPLE_DEPLOY_EU is set.
                  echo "deploy-prd: $result"
                  echo "deploy-prd-eu: ${{ needs.deploy-prd-eu.result }}"
