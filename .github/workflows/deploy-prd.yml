name: Deploy PRD (Cloudflare via Alchemy)

# Gated on CI passing (not `push: main`); `workflow_dispatch` skips the gate.
# One commit ships to every instance via `deploy-prd-instance.yml`; the ingest
# binary is built once and shared.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-prd
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write # Infisical OIDC machine-identity auth

jobs:
    # Main CI runs queue rather than cancel, and GitHub can start an older commit's
    # run after a newer one. Deploying it would roll prod back, so only main's tip deploys.
    freshness:
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        outputs:
            stale: ${{ steps.tip.outputs.stale }}
        steps:
            - id: tip
              env:
                  GH_TOKEN: ${{ github.token }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
                  if [ "$tip" = "$HEAD_SHA" ]; then
                      echo "stale=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "::notice::Skipping deploy: $HEAD_SHA is no longer main's tip ($tip); that commit's CI deploys it."
                      echo "stale=true" >> "$GITHUB_OUTPUT"
                  fi

    # Separate job for the arm64 runner; same gate so a red or stale CI builds nothing.
    ingest-binary:
        needs: freshness
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.freshness.outputs.stale == 'false') }}
        uses: ./.github/workflows/build-ingest-binary.yml

    # On workflow_run, `github.sha` is the branch head, not the commit CI tested: pin head_sha.
    deploy-prd:
        needs: ingest-binary
        if: ${{ !cancelled() && needs.ingest-binary.result == 'success' }}
        uses: ./.github/workflows/deploy-prd-instance.yml
        secrets: inherit
        with:
            region: us
            commit-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    # EU instance (`*.eu.maple.dev`), opt-in via the `MAPLE_DEPLOY_EU` repo variable.
    # Sequenced after `us` so a breaking change stops at one instance.
    deploy-prd-eu:
        needs: [ingest-binary, deploy-prd]
        if: ${{ !cancelled() && vars.MAPLE_DEPLOY_EU == '1' && needs.deploy-prd.result == 'success' }}
        uses: ./.github/workflows/deploy-prd-instance.yml
        secrets: inherit
        with:
            region: eu
            commit-sha: ${{ github.event.workflow_run.head_sha || github.sha }}

    # Skipped jobs do not fail a run, so this always runs and fails when nothing
    # deployed. A stale commit or a cancelled CI run is not a failure.
    deployment-gate:
        needs: [freshness, deploy-prd, deploy-prd-eu]
        if: ${{ always() }}
        runs-on: ubuntu-latest
        steps:
            - name: Report whether the deploy ran
              env:
                  CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
                  HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
              run: |
                  result="${{ needs.deploy-prd.result }}"
                  if [ "$result" = "skipped" ] && [ "${{ needs.freshness.outputs.stale }}" = "true" ]; then
                      echo "::notice::Nothing to deploy: $HEAD_SHA is no longer main's tip."
                      exit 0
                  fi
                  if [ "$result" = "skipped" ] && [ "$CI_CONCLUSION" = "cancelled" ]; then
                      echo "::notice::Nothing to deploy: CI for $HEAD_SHA was cancelled."
                      exit 0
                  fi
                  if [ "$result" = "skipped" ]; then
                      echo "::error::Nothing was deployed: CI did not pass for $HEAD_SHA. Fix main, then re-run."
                      exit 1
                  fi
                  # Real deploy failures already fail their own job. EU skips until MAPLE_DEPLOY_EU is set.
                  echo "deploy-prd: $result"
                  echo "deploy-prd-eu: ${{ needs.deploy-prd-eu.result }}"
