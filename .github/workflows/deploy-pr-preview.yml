name: Deploy PR Preview (Cloudflare + AWS via Alchemy)

# Label-gated: a PR gets the full stack (AWS ingest included) only while it carries
# `preview`, torn down when the label comes off or the PR closes. `preview:web` deploys the
# Workers alone (no ingest, Electric or landing) with the same seeded data, and `preview`
# wins when both are on. `preview:collector` adds the in-VPC OTel collector. Each preview gets its own Neon branch (migrated by the
# deploy), Tinybird branch, ingest gateway and Electric; see docs/pr-previews.md.
# cleanup-preview-orphans.yml reaps anything a missed teardown leaves behind.
on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
            - closed

# Only runs that deploy or tear down share the PR's group (same test as deploy-pr-preview's
# `if`). A run that skips both gets its own group, so a push to an unlabelled PR can't
# cancel its teardown mid-destroy and leak the stack (#1564).
concurrency:
    group: >-
        ${{ ((github.event.action == 'unlabeled'
                && (github.event.label.name == 'preview' || github.event.label.name == 'preview:web'))
            || (github.event.action != 'unlabeled'
                && (contains(github.event.pull_request.labels.*.name, 'preview')
                    || contains(github.event.pull_request.labels.*.name, 'preview:web'))))
        && format('pr-preview-{0}', github.event.pull_request.number)
        || format('pr-preview-noop-{0}', github.run_id) }}
    cancel-in-progress: true

permissions:
    contents: read
    deployments: write
    id-token: write # Infisical OIDC machine-identity auth
    pull-requests: write

jobs:
    # Separate job for the arm64 runner; skipped on teardown and on `preview:web`. Removing
    # `preview:web` while `preview` stays redeploys the full stack, so it builds then too.
    ingest-binary:
        if: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action != 'closed'
            && (github.event.action != 'unlabeled' || github.event.label.name == 'preview:web')
            && contains(github.event.pull_request.labels.*.name, 'preview') }}
        uses: ./.github/workflows/build-ingest-binary.yml

    deploy-pr-preview:
        # `!cancelled()`: teardown skips the binary build, and a skipped `needs` would
        # skip teardown too; `!= 'failure'` still blocks a broken build. On `unlabeled`
        # the payload's labels already exclude the removed one: removing one preview label
        # while the other stays redeploys in the remaining mode.
        needs: ingest-binary
        if: >-
            ${{ !cancelled() && needs.ingest-binary.result != 'failure'
            && github.event.pull_request.head.repo.full_name == github.repository
            && ((github.event.action == 'unlabeled'
                    && (github.event.label.name == 'preview' || github.event.label.name == 'preview:web'))
                || (github.event.action != 'unlabeled'
                    && (contains(github.event.pull_request.labels.*.name, 'preview')
                        || contains(github.event.pull_request.labels.*.name, 'preview:web')))) }}
        runs-on: ubuntu-latest
        timeout-minutes: 45
        outputs:
            web_url: ${{ steps.deploy.outputs.web_url }}
            api_url: ${{ steps.deploy.outputs.api_url }}
            smoke: ${{ steps.smoke.outcome }}
        # `pr-preview` holds its own Infisical identity, limited to the preview environment, so
        # PR code can never request `prod`. Required reviewers would also gate teardowns on close;
        # cleanup-preview-orphans.yml reaps any left waiting.
        environment:
            name: pr-preview
            url: ${{ steps.deploy.outputs.web_url }}
        env:
            # Set `PREVIEW_INFISICAL_ENV_SLUG` once a dedicated preview environment exists.
            INFISICAL_ENV_SLUG: ${{ vars.PREVIEW_INFISICAL_ENV_SLUG || 'dev' }}
            # Each live preview holds a VPC in the prd AWS account, whose us-east-1 quota of 5
            # leaves 3 beside the default and prd VPCs.
            MAX_LIVE_PREVIEWS: 3
            # Every preview, `preview:web` included, takes 1 of the account's 25 Hyperdrive configs.
            MAX_TOTAL_PREVIEWS: 8
            # `unlabeled` only reaches here for a preview label; it tears down once neither is left.
            TEARDOWN: >-
                ${{ (github.event.action == 'closed'
                    || (github.event.action == 'unlabeled'
                        && !contains(github.event.pull_request.labels.*.name, 'preview')
                        && !contains(github.event.pull_request.labels.*.name, 'preview:web')))
                && 'true' || 'false' }}
            # `preview:web` alone: Workers, Neon and Tinybird branches, nothing on AWS
            # (`webOnlyPreview` in alchemy.run.ts). Holds no VPC, so only the total cap applies.
            MAPLE_PREVIEW_WEB_ONLY: >-
                ${{ contains(github.event.pull_request.labels.*.name, 'preview:web')
                && !contains(github.event.pull_request.labels.*.name, 'preview') && '1' || '' }}
            # Opt-in collector (prd-only otherwise, see `profile.deploys.collector`).
            MAPLE_DEPLOY_AWS_COLLECTOR: ${{ contains(github.event.pull_request.labels.*.name, 'preview') && contains(github.event.pull_request.labels.*.name, 'preview:collector') && '1' || '' }}
            PR_NUMBER: ${{ github.event.pull_request.number }}
            PR_BRANCH: ${{ github.head_ref }}
            # PR head SHA (github.sha is the merge commit on pull_request events).
            COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            VITE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            # Counts open preview PRs, this one included. Runs before anything is created.
            - name: Check the live preview caps
              if: ${{ env.TEARDOWN != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  list() { gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$1" --limit 200 --json number --jq '.[].number'; }
                  full=$(list preview | wc -l | tr -d ' ')
                  total=$({ list preview; list preview:web; } | sort -u | wc -l | tr -d ' ')
                  echo "full previews: $full (cap $MAX_LIVE_PREVIEWS), all previews: $total (cap $MAX_TOTAL_PREVIEWS)"
                  if [ "$MAPLE_PREVIEW_WEB_ONLY" != "1" ] && [ "$full" -gt "$MAX_LIVE_PREVIEWS" ]; then
                    echo "::error::$full open PRs carry 'preview'; remove the label from one before deploying another."
                    exit 1
                  fi
                  if [ "$total" -gt "$MAX_TOTAL_PREVIEWS" ]; then
                    echo "::error::$total open PRs carry a preview label; remove one before deploying another."
                    exit 1
                  fi

            # Pinned uv and CLI versions instead of piping the vendor install script to sh.
            - name: Install uv
              uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

            # `tb` for branch up/down. Installed BEFORE secrets load so the installer never sees them.
            - name: Install Tinybird CLI
              run: |
                  uv tool install tinybird==5.0.2 --python 3.11
                  uv tool dir --bin >> "$GITHUB_PATH"

            # The AWS deploy role must trust `repo:<org>/<repo>:environment:pr-preview`.
            - name: Deploy setup
              id: setup
              uses: ./.github/actions/deploy-setup
              with:
                  infisical-env-slug: ${{ env.INFISICAL_ENV_SLUG }}
                  infisical-identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  infisical-project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  aws-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
                  ingest-binary: ${{ env.TEARDOWN != 'true' && env.MAPLE_PREVIEW_WEB_ONLY != '1' }}

            # Empty Tinybird branch `pr_<n>` with this PR's schema; overrides TINYBIRD_HOST/TOKEN
            # so the deploy binds to it (docs/tinybird-pr-branches.md).
            - name: Create/refresh Tinybird PR branch
              if: ${{ env.TEARDOWN != 'true' }}
              run: bun scripts/tinybird-pr-branch.ts up "$PR_NUMBER"

            # AWS_ACCOUNT_ID avoids alchemy's silent STS deadlock (see deploy-prd-instance.yml).
            - name: Deploy PR preview stack with Alchemy
              id: deploy
              if: ${{ env.TEARDOWN != 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ steps.setup.outputs.aws-account-id }}
              run: bun run alchemy:deploy:pr

            # Provisions the preview reviewer, seeds demo telemetry into its org, then fails on any
            # 5xx from a read path.
            - name: Seed and smoke-test the preview
              id: smoke
              if: ${{ env.TEARDOWN != 'true' && steps.deploy.outcome == 'success' }}
              env:
                  API_URL: ${{ steps.deploy.outputs.api_url }}
                  WEB_URL: ${{ steps.deploy.outputs.web_url }}
              run: bun scripts/preview-seed-smoke.ts

            - name: Destroy PR preview stack with Alchemy
              id: destroy
              if: ${{ env.TEARDOWN == 'true' }}
              env:
                  AWS_ACCOUNT_ID: ${{ steps.setup.outputs.aws-account-id }}
              run: bun run alchemy:destroy:pr

            # Fails if the collector is missing, undiscoverable, or logging export errors.
            - name: Verify the collector beside the gateway
              if: ${{ env.TEARDOWN != 'true' && env.MAPLE_DEPLOY_AWS_COLLECTOR == '1' }}
              env:
                  AWS_REGION: us-east-1
              run: bash scripts/ingest-preview-verify.sh

            # `!cancelled()`: a failed destroy must not leave the Tinybird branch behind
            # (branches share compute with production).
            - name: Remove Tinybird PR branch
              if: ${{ !cancelled() && env.TEARDOWN == 'true' }}
              run: bun scripts/tinybird-pr-branch.ts down "$PR_NUMBER"

            - name: Post or update PR preview comment
              if: ${{ always() }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPO: ${{ github.repository }}
                  ACTION: ${{ github.event.action }}
                  TEARDOWN: ${{ env.TEARDOWN }}
                  WEB_ONLY: ${{ env.MAPLE_PREVIEW_WEB_ONLY }}
                  INGEST_URL: ${{ steps.deploy.outputs.ingest_url }}
                  DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
                  SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
                  DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
                  WEB_URL: ${{ steps.deploy.outputs.web_url }}
                  API_URL: ${{ steps.deploy.outputs.api_url }}
                  SYNC_URL: ${{ steps.deploy.outputs.sync_url }}
                  COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
                  COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  COMMENT_OUTPUT: ${{ runner.temp }}/maple-preview-comment.md
              run: |
                  set -euo pipefail

                  marker="<!-- maple-preview-comment -->"
                  short_sha="${COMMIT_SHA:0:7}"

                  # Markdown code spans use literal backticks in the printf formats.
                  # shellcheck disable=SC2016
                  {
                    echo "$marker"
                    echo
                    echo "## 🍁 Maple PR preview"
                    echo

                    if [ "$TEARDOWN" = "true" ]; then
                      if [ "$DESTROY_OUTCOME" = "success" ]; then
                        echo "> [!NOTE]"
                        if [ "$ACTION" = "closed" ]; then
                          echo "> Preview resources were removed when this pull request closed."
                        else
                          echo "> Preview resources were removed when the preview label came off."
                        fi
                      else
                        echo "> [!WARNING]"
                        printf '> Preview cleanup could not be confirmed. The Alchemy teardown outcome was `%s`.\n' "$DESTROY_OUTCOME"
                      fi

                      echo
                      printf 'Final commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    elif [ "$DEPLOY_OUTCOME" = "success" ]; then
                      echo "The preview is ready:"
                      echo
                      echo "| Service | Preview URL |"
                      echo "| :-- | :-- |"
                      printf '| Web | [%s](%s) |\n' "${WEB_URL#https://}" "$WEB_URL"
                      printf '| API | [%s](%s) |\n' "${API_URL#https://}" "$API_URL"
                      if [ "$WEB_ONLY" != "1" ]; then
                        printf '| Electric Sync | [%s](%s) |\n' "${SYNC_URL#https://}" "$SYNC_URL"
                      fi
                      if [ -n "$INGEST_URL" ]; then
                        printf '| Ingest (OTLP) | [%s](%s) |\n' "${INGEST_URL#https://}" "$INGEST_URL"
                      fi
                      if [ "$WEB_ONLY" = "1" ]; then
                        echo
                        echo 'Web-only preview (`preview:web`): seeded demo data, no ingest gateway or Electric sync. Add `preview` for the full stack.'
                      fi
                      echo
                      case "$SMOKE_OUTCOME" in
                        success) echo "Smoke test: passed" ;;
                        failure) echo "Smoke test: failed (see the workflow run)" ;;
                        *) printf 'Smoke test: %s\n' "${SMOKE_OUTCOME:-not run}" ;;
                      esac
                      echo
                      echo 'Sign in with the **PR preview** form on the sign-in page and the preview access key (`PREVIEW_SIGNIN_KEY` in Infisical), or run `bun run preview:signin '"$PR_NUMBER"'` for a signed-in link.'
                      echo
                      printf 'Deployed from [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    else
                      echo "> [!WARNING]"
                      printf '> The latest preview deployment did not complete. The Alchemy deploy outcome was `%s`; any earlier preview should be treated as stale.\n' "$DEPLOY_OUTCOME"
                      echo
                      printf 'Commit [`%s`](%s) · [View workflow run](%s)\n' "$short_sha" "$COMMIT_URL" "$RUN_URL"
                    fi
                  } > "$COMMENT_OUTPUT"

                  existing=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
                    --jq '.[] | select(.body | startswith("<!-- maple-preview-comment -->")) | .id' \
                    | head -n 1)
                  if [ -n "$existing" ]; then
                    payload="$RUNNER_TEMP/maple-preview-comment-payload.json"
                    jq -Rs '{body: .}' < "$COMMENT_OUTPUT" > "$payload"
                    gh api -X PATCH "repos/$REPO/issues/comments/$existing" \
                      --input "$payload" >/dev/null
                    echo "updated existing preview comment $existing"
                  else
                    gh pr comment "$PR_NUMBER" --body-file "$COMMENT_OUTPUT"
                  fi

    # Browser e2e against the fresh preview (apps/web/e2e/README.md). Its own job so a slow
    # run does not hold the deploy, it reruns without redeploying, and it never sees the
    # deploy's AWS role or the rest of the preview's secrets.
    e2e:
        name: End-to-end tests against the preview
        needs: deploy-pr-preview
        if: ${{ needs.deploy-pr-preview.outputs.smoke == 'success' }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        # Checkout and the Infisical OIDC exchange; none of the workflow's write scopes.
        permissions:
            contents: read
            id-token: write
        # The Infisical identity is scoped to this environment.
        environment: pr-preview
        defaults:
            run:
                working-directory: apps/web/e2e
        env:
            MAPLE_E2E_APP_URL: ${{ needs.deploy-pr-preview.outputs.web_url }}
            MAPLE_E2E_API_URL: ${{ needs.deploy-pr-preview.outputs.api_url }}
            E2E_TELEMETRY_DISABLED: "1"
            SECRETS_FILE: /.e2e-secrets.env
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - uses: ./.github/actions/setup
              with:
                  install-filters: "@maple/web"
                  turbo-cache: "false"

            # @e2e-dev/web pins the Playwright build, so its version keys the browser.
            - name: Read the e2e engine version
              id: engine
              run: echo "version=$(bun -e 'console.log(require("@e2e-dev/web/package.json").version)')" >> "$GITHUB_OUTPUT"

            - name: Cache Chromium
              id: browser-cache
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/ms-playwright
                  key: e2e-web-${{ runner.os }}-${{ steps.engine.outputs.version }}-chromium

            # ubuntu-latest already carries Chromium's shared libraries (see ci.yml).
            - name: Install Chromium
              if: steps.browser-cache.outputs.cache-hit != 'true'
              run: bunx e2e-web install chromium

            # Exported to a file, not the env, so only the two keys the suite reads leave it.
            - name: Load deployment secrets from Infisical
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: ${{ vars.PREVIEW_INFISICAL_ENV_SLUG || 'dev' }}
                  export-type: "file"
                  file-output-path: ${{ env.SECRETS_FILE }}
                  secret-path: "/"

            # The action writes `KEY='value'` lines under the workspace; agent.* tests register
            # only when ANTHROPIC_API_KEY is set.
            - name: Keep only the e2e secrets
              working-directory: ${{ github.workspace }}
              run: |
                  file="$GITHUB_WORKSPACE$SECRETS_FILE"
                  for key in PREVIEW_SIGNIN_KEY ANTHROPIC_API_KEY; do
                    value=$(sed -n "s/^$key='\(.*\)'\$/\1/p" "$file")
                    [ -n "$value" ] || continue
                    echo "::add-mask::$value"
                    echo "$key=$value" >> "$GITHUB_ENV"
                  done
                  rm -f "$file"

            - name: Run the e2e suite
              run: bunx e2e run --reporter list,junit

            - name: Upload e2e results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: e2e-results
                  path: apps/web/e2e/.e2e/
                  if-no-files-found: warn
                  include-hidden-files: true
                  retention-days: 7
