name: Publish Maple OTel Chart

on:
    workflow_dispatch:
    push:
        tags:
            - "maple-otel-v*"

permissions:
    contents: read
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: publish-charts
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

            - name: Publish chart to GHCR
              env:
                  HELM_REGISTRY_USERNAME: ${{ github.actor }}
                  HELM_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
                  HELM_REGISTRY_OWNER: ${{ github.repository_owner }}
              run: ./scripts/publish-maple-otel-chart.sh
