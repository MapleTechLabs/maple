# DORMANT — disabled in the GitHub UI. Both Tinybird workspaces (EU prod and
# `maple_us`) are deployed by hand from a `tb login` (see
# docs/tinybird-pr-branches.md and the notes in the memory index); this file is
# kept for the day that moves back into CI.
name: Tinybird - CI Workflow

on:
    workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.event.pull_request.number }}

permissions:
    contents: read

jobs:
    ci:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        defaults:
            run:
                working-directory: "."
        services:
            tinybird:
                image: tinybirdco/tinybird-local@sha256:de47f2863c43bfec24024ea20db8a82cfe26511e69daf021d668e3be389a8a39 # latest
                ports:
                    - 7181:7181
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
            - name: Install Tinybird CLI
              run: curl https://tinybird.co | sh
            - name: Build project
              run: tb build
            - name: Test project
              run: tb test run
            - name: Deployment check
              env:
                  TINYBIRD_HOST: ${{ secrets.TINYBIRD_HOST }}
                  TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
              run: tb --cloud --host "$TINYBIRD_HOST" --token "$TINYBIRD_TOKEN" deploy --check
