name: OTel Collector Maple — tests

on:
    push:
        branches: [main]
        paths:
            - "packages/otel-collector-maple-exporter/**"
            - ".github/workflows/otel-collector-maple-tests.yml"
    pull_request:
        paths:
            - "packages/otel-collector-maple-exporter/**"
            - ".github/workflows/otel-collector-maple-tests.yml"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: packages/otel-collector-maple-exporter
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

            - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                  # Match `go 1.25.0` in packages/otel-collector-maple-exporter/go.mod.
                  go-version-file: packages/otel-collector-maple-exporter/go.mod
                  cache: true
                  cache-dependency-path: packages/otel-collector-maple-exporter/go.sum

            - name: gofmt -l
              run: |
                  diff=$(gofmt -l .)
                  if [ -n "$diff" ]; then
                    echo "::error::gofmt found unformatted files:"
                    echo "$diff"
                    exit 1
                  fi

            - name: go vet
              run: go vet ./...

            - name: go test
              run: go test -race -count=1 ./...
