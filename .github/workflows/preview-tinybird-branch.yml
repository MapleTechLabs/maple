name: Preview Tinybird branch

# Creates and removes each preview's Tinybird branch `pr_<n>` with the parent workspace
# credentials, so those never reach a job that runs PR code. `pull_request_target` runs
# main's copy of this file and main's code: never check out or run the PR head here.
# The branch's own credentials go to deploy-pr-preview.yml as a sealed artifact
# (`scripts/tinybird-pr-branch.ts`); that job deploys the PR's schema into the branch.
on:
    pull_request_target:
        types:
            - opened
            - reopened
            - synchronize
            - labeled
            - unlabeled
            - closed

# Same grouping as deploy-pr-preview.yml: a run that neither creates nor removes gets
# its own group, so it can't cancel a teardown.
concurrency:
    group: >-
        ${{ ((github.event.action == 'unlabeled'
                && (github.event.label.name == 'preview' || github.event.label.name == 'preview:web'))
            || (github.event.action != 'unlabeled' && github.event.action != 'opened'
                && (github.event.action != 'labeled' || contains(fromJSON('["preview","preview:web","preview:collector"]'), github.event.label.name))
                && (contains(github.event.pull_request.labels.*.name, 'preview')
                    || contains(github.event.pull_request.labels.*.name, 'preview:web'))))
        && format('pr-preview-tinybird-{0}', github.event.pull_request.number)
        || format('pr-preview-tinybird-noop-{0}', github.run_id) }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    branch:
        # Same-repo PRs only, on the same events deploy-pr-preview.yml deploys or tears down on.
        if: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository
            && ((github.event.action == 'unlabeled'
                    && (github.event.label.name == 'preview' || github.event.label.name == 'preview:web'))
                || (github.event.action != 'unlabeled' && github.event.action != 'opened'
                    && (github.event.action != 'labeled' || contains(fromJSON('["preview","preview:web","preview:collector"]'), github.event.label.name))
                    && (contains(github.event.pull_request.labels.*.name, 'preview')
                        || contains(github.event.pull_request.labels.*.name, 'preview:web')))) }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            id-token: write # Infisical OIDC machine-identity auth
            pull-requests: read # the live preview caps
        # Deploys from main only, and carries the one Infisical identity that may read the
        # parent workspace credentials.
        environment: preview-tinybird
        env:
            PR_NUMBER: ${{ github.event.pull_request.number }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            # Same caps and web-only test as deploy-pr-preview.yml, so a preview the deploy
            # refuses gets no branch either.
            MAX_LIVE_PREVIEWS: 3
            MAX_TOTAL_PREVIEWS: 8
            WEB_ONLY: >-
                ${{ contains(github.event.pull_request.labels.*.name, 'preview:web')
                && !contains(github.event.pull_request.labels.*.name, 'preview') && '1' || '' }}
            # The deploy run for the same event gets the same payload, so this names the
            # handoff for exactly one event: a re-label never picks up an earlier one.
            EVENT_STAMP: ${{ github.event.pull_request.updated_at }}
            TEARDOWN: >-
                ${{ (github.event.action == 'closed'
                    || (github.event.action == 'unlabeled'
                        && !contains(github.event.pull_request.labels.*.name, 'preview')
                        && !contains(github.event.pull_request.labels.*.name, 'preview:web')))
                && 'true' || 'false' }}
        steps:
            - name: Check the live preview caps
              id: caps
              if: ${{ env.TEARDOWN != 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  list() { gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$1" --limit 200 --json number --jq '.[].number'; }
                  full=$(list preview | wc -l | tr -d ' ')
                  total=$({ list preview; list preview:web; } | sort -u | wc -l | tr -d ' ')
                  if { [ "$WEB_ONLY" != "1" ] && [ "$full" -gt "$MAX_LIVE_PREVIEWS" ]; } || [ "$total" -gt "$MAX_TOTAL_PREVIEWS" ]; then
                    echo "::notice::Over the preview caps ($full full, $total total); the deploy refuses this one, so no branch is created."
                    echo "over=true" >> "$GITHUB_OUTPUT"
                  fi

            # The base branch (main), never the PR head.
            - name: Checkout main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

            # Before secrets load, so the installers never see them.
            - name: Install Tinybird CLI
              run: |
                  uv tool install tinybird==5.0.2 --python 3.11
                  uv tool dir --bin >> "$GITHUB_PATH"

            # Bun alone: create and down import nothing outside node builtins, so no install runs.
            - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
              with:
                  install_args: bun

            # By name, so nothing else from the environment reaches this job.
            - name: Load the parent workspace host
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: dev
                  export-type: "env"
                  secret-name: TINYBIRD_HOST

            - name: Load the parent workspace token
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: dev
                  export-type: "env"
                  secret-name: TINYBIRD_TOKEN

            - name: Load the handoff key
              if: ${{ env.TEARDOWN != 'true' }}
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: "oidc"
                  identity-id: ${{ secrets.INFISICAL_MACHINE_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: dev
                  export-type: "env"
                  secret-name: PREVIEW_HANDOFF_KEY

            - name: Create or refresh the branch
              id: create
              if: ${{ env.TEARDOWN != 'true' && steps.caps.outputs.over != 'true' }}
              run: |
                  bun scripts/tinybird-pr-branch.ts create "$PR_NUMBER" "$RUNNER_TEMP/tinybird-branch.sealed"
                  echo "artifact=tinybird-branch-${PR_NUMBER}-${HEAD_SHA}-${EVENT_STAMP//[^0-9]/}" >> "$GITHUB_OUTPUT"

            # Named for this event, which the deploy job waits for. Sealed, because
            # artifacts of a public repo can be downloaded by anyone.
            - name: Hand the branch to the deploy job
              if: ${{ env.TEARDOWN != 'true' && steps.caps.outputs.over != 'true' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ steps.create.outputs.artifact }}
                  path: ${{ runner.temp }}/tinybird-branch.sealed
                  if-no-files-found: error
                  # Long enough to re-run a deploy; the branch token dies with the branch anyway.
                  retention-days: 7

            # Branches share compute with production, so removal is not optional.
            - name: Remove the branch
              if: ${{ env.TEARDOWN == 'true' }}
              run: bun scripts/tinybird-pr-branch.ts down "$PR_NUMBER"
